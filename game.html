<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Classic Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 { margin-bottom: 5px; color: #00ffcc; }
        #scoreBoard { font-size: 1.5rem; margin-bottom: 15px; }
        canvas {
            border: 4px solid #00ffcc;
            background-color: #0f3460;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        p { color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Snake Game</h1>
    <div id="scoreBoard">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Khelne ke liye Keyboard ke Arrow Keys (Up, Down, Left, Right) dabayein</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("scoreBoard");

        const box = 20; // Ek block ka size
        let score = 0;

        // Snake ki shuruati position
        let snake = [{ x: 9 * box, y: 10 * box }];

        // Khane (Food) ki random position
        let food = {
            x: Math.floor(Math.random() * 19 + 1) * box,
            y: Math.floor(Math.random() * 19 + 1) * box
        };

        let direction = "";

        // Keyboard controls
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (event.keyCode == 37 && direction != "RIGHT") direction = "LEFT";
            else if (event.keyCode == 38 && direction != "DOWN") direction = "UP";
            else if (event.keyCode == 39 && direction != "LEFT") direction = "RIGHT";
            else if (event.keyCode == 40 && direction != "UP") direction = "DOWN";
        }

        // Khud se takrane par Game Over check
        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        // Main Game Loop
        function draw() {
            ctx.fillStyle = "#0f3460";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Snake ko draw karna
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#00ffcc" : "#e94560";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#0f3460";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            // Food ko draw karna
            ctx.fillStyle = "#ffd700";
            ctx.fillRect(food.x, food.y, box, box);

            // Snake ke sir (head) ki purani position
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            // Direction ke hisab se aage badhana
            if (direction == "LEFT") snakeX -= box;
            if (direction == "UP") snakeY -= box;
            if (direction == "RIGHT") snakeX += box;
            if (direction == "DOWN") snakeY += box;

            // Agar snake food kha le
            if (snakeX == food.x && snakeY == food.y) {
                score += 10;
                scoreElement.innerHTML = "Score: " + score;
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                snake.pop(); // Pichla hissa hatana taaki snake chalta hua dikhe
            }

            let newHead = { x: snakeX, y: snakeY };

            // Game Over conditions (Deewar ya khud se takrana)
            if (snakeX < 0 || snakeY < 0 || snakeX >= canvas.width || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(game);
                alert("Game Over! Aapka Final Score hai: " + score);
                location.reload(); // Game restart karne ke liye
            }

            snake.unshift(newHead);
        }

        // Har 120 milliseconds me game update hoga (Speed control)
        let game = setInterval(draw, 120);
    </script>

</body>
</html>
